services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smarttrap
      POSTGRES_PASSWORD: smarttrap
      POSTGRES_DB: smarttrap
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttrap -d smarttrap"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://smarttrap:smarttrap@db:5432/smarttrap
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ADMIN_NAME: ${ADMIN_NAME:-SuperAdmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smarttrap.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      USER_NAME: ${USER_NAME:-Usuário comum}
      USER_EMAIL: ${USER_EMAIL:-usuario@smarttrap.local}
      USER_PASSWORD: ${USER_PASSWORD:-usuario123}
      DEMO_NAME: ${DEMO_NAME:-Conta demonstração}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@smarttrap.local}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-dev-gateway-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CAPTURES_DIR: /app/data/captures
      FIRMWARE_DIR: /app/data/firmware
      MODELS_DIR: /app/data/models
      EI_API_KEY: ${EI_API_KEY:-}
      EI_PROJECT_ID: ${EI_PROJECT_ID:-0}
      EI_LEARN_ID: ${EI_LEARN_ID:-0}
    volumes:
      - ./data/captures:/app/data/captures
      - ./data/firmware:/app/data/firmware
      - ./data/models:/app/data/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
